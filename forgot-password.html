<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResCraft - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Logo/SRA_Logo.ico">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Forgot Password</h1>
                <p class="login-subtitle">Enter your registered email to receive a verification code.</p>
            </div>

            <div class="login-form active-form">
                <form onsubmit="handleSendOtp(event)">
                    <div class="form-group">
                        <label for="forgotEmail" class="form-label">Registered Email Address</label>
                        <div class="input-group">
                            <span class="input-icon"><i class="fas fa-envelope"></i></span>
                            <input type="email" id="forgotEmail" class="form-control login-input" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">Send Verification Code</button>
                    <p class="text-muted small mt-2">Demo mode: if email sending is not configured, the reset code will be shown in the browser.</p>
                </form>

                <div class="form-footer">
                    <p>Remembered your password? <a href="login.html" class="toggle-link">Login</a></p>
                </div>
            </div>

            <div id="alertMessage" class="alert alert-danger alert-dismissible fade" role="alert" style="display: none;">
                <span id="alertText"></span>
                <button type="button" class="btn-close" onclick="closeAlert()" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="login-script.js"></script>
</body>
</html>
